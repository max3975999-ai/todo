<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>待辦助理</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b6cf6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1b1d21;--sub:#6b7280;--line:#e5e7eb;
  --accent:#3b6cf6;--accent-text:#fff;--danger:#e5484d;--chip:#e8eaef;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111317;--card:#1c1f26;--text:#eceef2;--sub:#9aa1ae;--line:#2b2f38;
    --accent:#6b8cff;--accent-text:#0b0d12;--danger:#ff6b70;--chip:#2a2e37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317;--card:#1c1f26;--text:#eceef2;--sub:#9aa1ae;--line:#2b2f38;
  --accent:#6b8cff;--accent-text:#0b0d12;--danger:#ff6b70;--chip:#2a2e37;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:8px 0 2px}
.sub{color:var(--sub);font-size:14px;margin-bottom:16px}
.row{display:flex;gap:8px}
input[type=text],input[type=datetime-local]{
  width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
button{font:inherit;cursor:pointer;border:0}
.add{background:var(--accent);color:var(--accent-text);font-weight:600;border-radius:12px;padding:0 18px;white-space:nowrap}
.mic{background:var(--chip);color:var(--text);border-radius:12px;padding:0 14px;font-size:20px}
.mic.rec{background:var(--danger);color:#fff}
.hint{font-size:13px;color:var(--sub);margin:8px 2px 0;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--chip);color:var(--text);border-radius:16px;padding:6px 12px;font-size:14px}
.dt{margin-top:2px}
.banner{background:var(--accent);color:var(--accent-text);border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none;font-weight:600}
.perm{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px;color:var(--sub);display:none}
.perm button{background:none;color:var(--accent);font-weight:600;padding:0 4px}
ul{list-style:none;padding:0;margin:16px 0 0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);background:none;flex:none;padding:0;color:var(--accent-text);font-size:14px;line-height:1}
li.done .box{background:var(--accent);border-color:var(--accent)}
.body{flex:1;min-width:0}
.t{font-size:16px;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--sub)}
.d{font-size:13px;color:var(--sub);margin-top:2px}
.d.over{color:var(--danger)}
.cal{background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 0 0}
.del{background:none;color:var(--sub);font-size:18px;padding:4px 6px}
.empty{text-align:center;color:var(--sub);margin-top:40px}
</style>
</head>
<body>
<main>
  <h1>待辦助理</h1>
  <div class="sub" id="summary"></div>

  <div class="banner" id="banner"></div>
  <div class="perm" id="perm">開啟通知，時間到時手機會跳出提醒。<button id="permBtn">允許通知</button></div>

  <div class="row">
    <input type="text" id="title" placeholder="要做什麼？" autocomplete="off" enterkeyhint="done">
    <button class="mic" id="micBtn" aria-label="語音輸入">🎤</button>
    <button class="add" id="addBtn">新增</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="chips" id="chips"></div>
  <div class="dt"><input type="datetime-local" id="due" aria-label="提醒時間"></div>

  <ul id="list"></ul>
  <div class="empty" id="empty">目前沒有待辦事項 ✨</div>
</main>

<script>
(function(){
  var KEY = "todo-assistant-v1";
  var tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { tasks = []; }

  var $ = function(id){ return document.getElementById(id); };
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function toInput(d){
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmt(ms){
    return new Date(ms).toLocaleString("zh-TW", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
  }

  // 快速選時間
  var quick = [
    ["1 小時後", function(){ return new Date(Date.now() + 3600000); }],
    ["今晚 8 點", function(){ var d = new Date(); d.setHours(20,0,0,0); if (d <= new Date()) d.setDate(d.getDate()+1); return d; }],
    ["明早 9 點", function(){ var d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d; }],
    ["清除", function(){ return null; }]
  ];
  quick.forEach(function(q){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = q[0];
    b.onclick = function(){ var d = q[1](); $("due").value = d ? toInput(d) : ""; };
    $("chips").appendChild(b);
  });

  // ===== 口語時間解析：「明天下午三點開會」→ 標題＋時間 =====
  var CNUM = {"零":0,"〇":0,"一":1,"二":2,"兩":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  function toNum(x){
    if (/^[0-9]+$/.test(x)) return parseInt(x, 10);
    if (x.indexOf("十") >= 0){
      var p = x.split("十");
      return (p[0] ? CNUM[p[0]] : 1) * 10 + (p[1] ? CNUM[p[1]] : 0);
    }
    var t = 0;
    for (var i = 0; i < x.length; i++) t = t * 10 + (CNUM[x.charAt(i)] || 0);
    return t;
  }
  function parseCN(text){
    var s = text.replace(/\s+(?=[\u4e00-\u9fff0-9:])|(?<=[\u4e00-\u9fff0-9:])\s+/g, "");
    var N = "(?:[0-9]{1,2}|[零〇一二兩三四五六七八九十]{1,3})";
    var now = new Date(), m;
    var day = null, weakDay = false, rollWeek = false;
    var hour = null, min = 0, period = null, rel = null;
    function cut(re){ var r = s.match(re); if (r) s = s.replace(r[0], ""); return r; }
    function dayOffset(n){
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      d.setDate(d.getDate() + n);
      return d;
    }

    // 幾小時／幾分鐘後
    if (cut(/半個?小時(?:後|之後)/)) rel = 1800000;
    else if ((m = cut(new RegExp("(" + N + ")個?小時(?:後|之後)")))) rel = toNum(m[1]) * 3600000;
    else if ((m = cut(new RegExp("(" + N + ")分鐘?(?:後|之後)")))) rel = toNum(m[1]) * 60000;

    if (rel === null){
      // 日期
      if ((m = cut(new RegExp("(" + N + ")天(?:後|之後)")))) day = dayOffset(toNum(m[1]));
      else if (cut(/大後天/)) day = dayOffset(3);
      else if (cut(/後天/)) day = dayOffset(2);
      else if ((m = cut(/明[天日早晨晚]/))){
        day = dayOffset(1);
        if (/[早晨]/.test(m[0])) period = "早上";
        if (/晚/.test(m[0])) period = "晚上";
      }
      else if ((m = cut(/今[天日早晨晚]/))){
        day = dayOffset(0);
        if (/[早晨]/.test(m[0])) period = "早上";
        if (/晚/.test(m[0])) period = "晚上";
      }
      else if ((m = cut(/([這本下])?(?:週|周|星期|禮拜)([一二三四五六日天])/))){
        var wd = "日一二三四五六".indexOf(m[2] === "天" ? "日" : m[2]);
        var cur = now.getDay();
        if (m[1] === "下"){
          day = dayOffset(-((cur + 6) % 7) + 7 + ((wd + 6) % 7));
        } else {
          var diff = (wd - cur + 7) % 7;
          day = dayOffset(diff);
          if (diff === 0) rollWeek = true;
        }
      }
      else if ((m = cut(new RegExp("(" + N + ")月(" + N + ")[日號]")))){
        var y = now.getFullYear(), d1 = new Date(y, toNum(m[1]) - 1, toNum(m[2]));
        if (d1.getTime() < dayOffset(0).getTime()) d1.setFullYear(y + 1);
        day = d1;
      }
      else if ((m = cut(new RegExp("(" + N + ")[日號]")))){
        var d2 = new Date(now.getFullYear(), now.getMonth(), toNum(m[1]));
        if (d2.getTime() < dayOffset(0).getTime()) d2.setMonth(d2.getMonth() + 1);
        day = d2; weakDay = true;
      }

      // 時段與幾點
      if ((m = cut(/凌晨|半夜|清晨|早上|早晨|上午|中午|下午|傍晚|晚上|晚間|夜裡|夜晚/))) period = m[0];
      if ((m = cut(/([0-9]{1,2}):([0-9]{2})/))){
        hour = parseInt(m[1], 10); min = parseInt(m[2], 10);
      } else if ((m = cut(new RegExp("(" + N + ")[點時](?:(半)|整|(" + N + ")分?)?")))){
        hour = toNum(m[1]);
        if (m[2]) min = 30; else if (m[3]) min = toNum(m[3]);
      }
      if (hour !== null && period){
        if (/下午|傍晚|晚上|晚間|夜裡|夜晚/.test(period)){ if (hour < 12) hour += 12; }
        else if (/中午/.test(period)){ if (hour < 6) hour += 12; }
        else if (hour === 12) hour = 0;
      }
      if (hour === null && period){
        hour = /中午/.test(period) ? 12 : /下午/.test(period) ? 15 : /傍晚/.test(period) ? 18 :
               /晚/.test(period) || /夜/.test(period) ? 20 : /凌晨|半夜/.test(period) ? 3 : 9;
      }
    }

    var found = rel !== null || hour !== null || (day !== null && !weakDay);
    if (!found) return { found: false, title: text };

    var due;
    if (rel !== null){
      due = new Date(now.getTime() + rel);
    } else {
      var base = day || dayOffset(0);
      var hh = hour !== null ? hour : 9;
      due = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh, min, 0, 0);
      if (due.getTime() <= now.getTime()){
        if (day === null){
          if (!period && hh >= 1 && hh <= 11){
            var pm = new Date(due.getTime()); pm.setHours(hh + 12);
            if (pm.getTime() > now.getTime()) due = pm;
          }
          if (due.getTime() <= now.getTime()) due.setDate(due.getDate() + 1);
        } else if (rollWeek){
          due.setDate(due.getDate() + 7);
        }
      }
    }

    var title = s.replace(/^[，,。、；;\s]+|[，,。、；;\s]+$/g, "");
    var stripped = title.replace(/^(?:請|麻煩)?(?:提醒我|叫我|記得|幫我|提醒)(?:要|去)?/, "")
                        .replace(/^[的，,。、\s]+/, "");
    title = stripped || title || "待辦事項";
    return { found: true, title: title, due: due.getTime() };
  }

  // ===== 語音輸入 =====
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false;
  function setHint(t){ $("hint").textContent = t || ""; }
  function applySpoken(said){
    var r = parseCN(said);
    $("title").value = r.title;
    if (r.found){
      $("due").value = toInput(new Date(r.due));
      setHint("聽到：「" + said + "」→ ⏰ " + fmt(r.due) + "。確認後按「新增」");
    } else {
      setHint("聽到：「" + said + "」，沒有偵測到時間，可點下面的快速時間。");
    }
  }
  $("micBtn").onclick = function(){
    if (!SR){ setHint("這個瀏覽器不支援語音輸入，可改用鍵盤上的麥克風。"); return; }
    if (listening && rec){ rec.stop(); return; }
    rec = new SR();
    rec.lang = "zh-TW"; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
    rec.onstart = function(){
      listening = true; $("micBtn").classList.add("rec");
      setHint("請說話，例如「明天下午三點開會」");
    };
    rec.onend = function(){ listening = false; $("micBtn").classList.remove("rec"); };
    rec.onerror = function(e){
      var msg = {
        "not-allowed": "請允許麥克風權限後再試一次。",
        "service-not-allowed": "請允許麥克風權限後再試一次。",
        "no-speech": "沒有聽到聲音，再按一次麥克風試試。",
        "network": "語音辨識需要網路連線。",
        "audio-capture": "找不到麥克風。"
      }[e.error];
      setHint(msg || "語音輸入失敗，請再試一次。");
    };
    rec.onresult = function(e){ applySpoken(e.results[0][0].transcript); };
    try { rec.start(); } catch (err) { setHint("無法啟動語音輸入。"); }
  };

  function add(){
    var text = $("title").value.trim();
    if (!text) return;
    var v = $("due").value;
    var due = v ? new Date(v).getTime() : null;
    if (due === null){
      var r = parseCN(text);
      if (r.found){ text = r.title; due = r.due; }
    }
    tasks.unshift({ id: Date.now().toString(36), title: text, done: false, due: due, notified: false });
    $("title").value = ""; $("due").value = ""; $("hint").textContent = "";
    save(); render();
  }
  $("addBtn").onclick = add;
  $("title").addEventListener("keydown", function(e){ if (e.key === "Enter") add(); });

  // 匯出成行事曆檔（.ics），由手機行事曆在背景準時提醒
  function icsEsc(s){
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }
  function icsTime(ms){
    return new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  }
  function downloadIcs(t){
    var lines = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TodoAssistant//ZH", "BEGIN:VEVENT",
      "UID:" + t.id + "@todo-assistant",
      "DTSTAMP:" + icsTime(Date.now()),
      "DTSTART:" + icsTime(t.due),
      "DTEND:" + icsTime(t.due + 1800000),
      "SUMMARY:" + icsEsc(t.title),
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t.title), "TRIGGER:-PT10M", "END:VALARM",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t.title), "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"
    ];
    var blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "todo-" + t.id + ".ics";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  // 一鍵加入行事曆：Android 直接開啟系統行事曆的新增畫面（已填好標題與時間）
  function addToCalendar(t){
    if (!/Android/i.test(navigator.userAgent)){ downloadIcs(t); return; }
    var end = t.due + 1800000;
    var gcal = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(t.title) +
      "&dates=" + icsTime(t.due) + "/" + icsTime(end);
    var intent = "intent:#Intent;action=android.intent.action.INSERT;" +
      "package=com.google.android.calendar;" +
      "type=vnd.android.cursor.dir/event;" +
      "S.title=" + encodeURIComponent(t.title) + ";" +
      "l.beginTime=" + t.due + ";" +
      "S.browser_fallback_url=" + encodeURIComponent(gcal) + ";end";
    window.location.href = intent;
  }

  function render(){
    var list = $("list");
    list.innerHTML = "";
    var sorted = tasks.slice().sort(function(a,b){
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.due && b.due) return a.due - b.due;
      if (a.due) return -1;
      if (b.due) return 1;
      return 0;
    });
    var now = Date.now();
    sorted.forEach(function(t){
      var li = document.createElement("li");
      if (t.done) li.className = "done";

      var box = document.createElement("button");
      box.className = "box"; box.setAttribute("aria-label", "切換完成");
      box.textContent = t.done ? "✓" : "";
      box.onclick = function(){ t.done = !t.done; save(); render(); };

      var body = document.createElement("div"); body.className = "body";
      var title = document.createElement("div"); title.className = "t"; title.textContent = t.title;
      body.appendChild(title);
      if (t.due){
        var d = document.createElement("div");
        var over = !t.done && t.due < now;
        d.className = "d" + (over ? " over" : "");
        d.textContent = "⏰ " + fmt(t.due) + (over ? "（已逾時）" : "");
        body.appendChild(d);
        if (!t.done){
          var cal = document.createElement("button");
          cal.className = "cal"; cal.textContent = "📅 加入行事曆";
          cal.onclick = function(){ addToCalendar(t); };
          body.appendChild(cal);
        }
      }

      var del = document.createElement("button");
      del.className = "del"; del.setAttribute("aria-label", "刪除"); del.textContent = "✕";
      del.onclick = function(){ tasks = tasks.filter(function(x){ return x.id !== t.id; }); save(); render(); };

      li.appendChild(box); li.appendChild(body); li.appendChild(del);
      list.appendChild(li);
    });
    var left = tasks.filter(function(t){ return !t.done; }).length;
    $("summary").textContent = tasks.length ? "還有 " + left + " 項未完成" : "新增你的第一個待辦吧";
    $("empty").style.display = tasks.length ? "none" : "block";
  }

  // 提醒：頁面開著時，時間到就跳橫幅（有授權也會發系統通知）
  function checkReminders(){
    var now = Date.now(), hit = [];
    tasks.forEach(function(t){
      if (!t.done && t.due && !t.notified && t.due <= now){ t.notified = true; hit.push(t); }
    });
    if (!hit.length) return;
    save(); render();
    var msg = "⏰ 時間到了：" + hit.map(function(t){ return t.title; }).join("、");
    var b = $("banner"); b.textContent = msg; b.style.display = "block";
    b.onclick = function(){ b.style.display = "none"; };
    try {
      if ("Notification" in window && Notification.permission === "granted"){
        hit.forEach(function(t){ new Notification("待辦提醒", { body: t.title }); });
      }
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
  }
  setInterval(checkReminders, 15000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) checkReminders(); });

  // 通知權限
  try {
    if ("Notification" in window && Notification.permission === "default"){
      $("perm").style.display = "block";
      $("permBtn").onclick = function(){
        Notification.requestPermission().then(function(){ $("perm").style.display = "none"; });
      };
    }
  } catch (e) {}

  render();
  checkReminders();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
